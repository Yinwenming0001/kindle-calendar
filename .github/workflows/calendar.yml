name: Render Kindle Calendar

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体与依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fontconfig
          pip install --quiet pillow requests

      - name: 校验中文字体（缺失则下载兜底）
        run: |
          mkdir -p public fonts
          if ! fc-list :lang=zh | grep -qi .; then
            echo "系统无中文字体，下载 Noto Sans SC …"
            curl -sL -o fonts/NotoSansSC-Regular.otf \
              https://raw.githubusercontent.com/googlefonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf || true
            if [ -s fonts/NotoSansSC-Regular.otf ]; then
              sudo mkdir -p /usr/share/fonts/truetype/noto
              sudo cp fonts/NotoSansSC-Regular.otf /usr/share/fonts/truetype/noto/
              sudo fc-cache -f > /dev/null
            fi
          fi
          fc-list :lang=zh | head -3

      - name: 生成台历图片
        run: python render_calendar.py --device ${{ vars.DEVICE || 'basic10' }} --out public/calendar.png

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          user_name: kindle-calendar-bot
          user_email: bot@users.noreply.github.com
          commit_message: "calendar update"
